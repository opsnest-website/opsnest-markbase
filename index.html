*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.app{min-height:100vh}.top{height:72px;display:flex;align-items:center;gap:22px;padding:0 clamp(16px,3vw,42px);background:#ffffffed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.8px;white-space:nowrap}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:0 5px 12px #5b5ce244}.brand span{color:var(--accent)}.toplabel{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);padding-left:16px;border-left:1px solid var(--line)}.search{max-width:560px;flex:1;margin:auto;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 42px;background:#f8f9fc;color:var(--ink);outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #5b5ce21a}.search:before{content:"⌕";position:absolute;left:15px;top:5px;font-size:24px;color:var(--muted)}.shortcut{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:white;color:var(--muted);border-radius:5px;padding:0 5px;font-size:11px}.top-actions{display:flex;gap:8px}.btn{border:0;background:var(--accent);color:white;border-radius:11px;padding:10px 15px;font-weight:750;box-shadow:0 4px 10px #5b5ce222;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 15px #5b5ce233}.btn.light{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.dark{background:var(--navy);box-shadow:none}.btn.small{padding:7px 10px;font-size:12px}.mobile-menu{display:none}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{height:calc(100vh - 72px);position:sticky;top:72px;overflow:auto;padding:25px 16px 30px 22px;border-right:1px solid var(--line);background:#f9faff}.side-label{font-size:10px;letter-spacing:1.5px;font-weight:850;color:#9aa4b7;margin:20px 0 8px 10px;text-transform:uppercase}.side-label:first-child{margin-top:0}.navbtn{width:100%;border:0;background:transparent;color:#5e6a80;padding:9px 11px;text-align:left;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;margin:2px 0}.navbtn:hover{background:#eef0fa;color:var(--ink)}.navbtn.active{background:var(--accent2);color:var(--accent);font-weight:750}.navicon{width:24px;height:24px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:850}.navbtn.active .navicon{background:var(--accent);border-color:var(--accent);color:#fff}.side-bottom{margin:28px 5px 0;padding:15px;border-radius:14px;background:#eeefff;border:1px solid #e1e1ff}.side-bottom b{font-size:12px}.side-bottom p{font-size:11px;color:var(--muted);margin:5px 0 10px}.main{min-width:0;padding:32px clamp(18px,3.3vw,52px) 50px;max-width:1350px;width:100%;margin:0 auto}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:16px}.hero{position:relative;overflow:hidden;border-radius:25px;background:var(--navy);color:white;padding:clamp(28px,5vw,58px);min-height:320px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:350px;height:350px;border-radius:50%;right:-60px;top:-120px;background:radial-gradient(circle,#7778ff88,transparent 68%);pointer-events:none}.hero:before{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff19;border-radius:50%;right:70px;bottom:-140px;box-shadow:0 0 0 35px #ffffff06,0 0 0 70px #ffffff05}.hero-inner{position:relative;z-index:1;max-width:720px}.kicker{font-s esson-layout{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:28px}.lesson{min-width:0;background:white;border:1px solid var(--line);border-radius:17px;padding:clamp(20px,3vw,38px);box-shadow:var(--shadow)}.lesson h2{font-size:24px;letter-spacing:-.5px;margin:32px 0 10px}.lesson h3{font-size:18px;margin:24px 0 8px}.lesson p,.lesson li{color:#46536a}.lesson pre{background:var(--code);color:#e1e8ff;padding:17px;border-radius:12px;overflow:auto;line-height:1.7;font-size:13px}.lesson code,.quiz code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.lesson p code,.lesson li code{background:#f0f1fa;color:#4649b4;padding:2px 5px;border-radius:4px}.lesson pre code{background:none;color:inherit;padding:0}.lesson blockquote{border-left:3px solid var(--accent);padding:10px 15px;background:#f7f7ff;margin:16px 0;color:#4f5680}.lesson .callout{padding:14px;background:#effaf5;border:1px solid #d4f1e4;border-radius:11px;color:#23664e;margin:18px 0}.lesson .callout.warn{background:#fff8e9;border-color:#f6e6bf;color:#806019}.lesson table{width:100%;border-collapse:collapse;font-size:13px}.lesson th,.lesson td{padding:9px;border:1px solid var(--line);text-align:left}.lesson th{background:#f6f7fb}.lesson-side{position:sticky;top:100px;align-self:start}.lesson-side h4{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8d98ac}.lesson-side a{display:block;font-size:12px;color:#66728a;padding:5px 0}.lesson-side .side-card{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:18px}.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.quiz{border:1px solid var(--line);border-radius:15px;padding:19px;background:#fbfbff;margin:20px 0}.quiz h3{margin:0 0 7px}.option{display:flex;gap:9px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:white;cursor:pointer;font-size:13px}.option:has(input:checked){border-color:var(--accent);background:#f4f4ff}.feedback{margin-top:10px;font-size:13px;font-weight:700}.playground{display:grid;grid-template-columns:1fr 1fr;gap:12px}.playground textarea{width:100%;min-height:300px;resize:vertical;border:1px solid #26334e;background:var(--code);color:#e3eaff;border-radius:12px;padding:15px;outline:none;font:13px/1.65 ui-monospace,monospace}.preview{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:300px;overflow:auto;color:#273247}.preview h1,.preview h2,.preview h3{margin:8px 0;color:#172033}.preview pre{background:#11182a;color:#e6edff;padding:12px;border-radius:8px;overflow:auto}.preview table{border-collapse:collapse;width:100%}.preview th,.preview td{border:1px solid #dce1eb;padding:6px}.preview blockquote{border-left:3px solid var(--accent);padding-left:10px;color:#64718a}.empty{padding:35px;color:var(--muted)}.footer{border-top:1px solid var(--line);margin-top:48px;padding-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#8a95a8;font-size:11px}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:50;font-size:13px}.hidden{display:none!important}

<script>
const tracks=[
{id:"go",name:"Go",symbol:"G",cls:"go",tag:"Programming language",level:"Beginner to advanced",desc:"Build efficient, concurrent and maintainable software with Go.",official:"https://go.dev/doc/",quick:"https://go.dev/tour/",topics:[
["Your first Go program","Set up the toolchain and understand packages, main and fmt.",`<h2>What is Go?</h2><p>Go is a compiled, statically typed language with built-in support for concurrency and a focused standard library. It is commonly used for services, infrastructure tools and command-line applications.</p><h2>Your first program</h2><pre><code>package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, Go!")\n}</code></pre><p>Save as <code>main.go</code>, then run <code>go run main.go</code>. The <code>main</code> package builds an executable; <code>main()</code> is its entry point.</p>`,`What does package main signal in an executable Go program?`,["It defines an executable program","It installs the Go compiler","It declares a test suite"],0,"Run the program, change the message, then run it again."],
["Variables, types and constants","Learn declarations, zero values, conversions and basic types.",`<h2>Declare values</h2><pre><code>name := "Mukul"\nvar retries int = 3\nconst appName = "worker"\n\nfmt.Println(name, retries, appName)</code></pre><p><code>:=</code> declares and infers a local variable. Use <code>var</code> when you need an explicit declaration or want to declare before assignment. Constants represent compile-time values.</p><h2>Zero values</h2><p>Uninitialized variables receive useful zero values: numeric types start at zero, booleans at false, strings at an empty string, and pointer-like types at nil.</p>`,`Which operator is commonly used for short variable declaration inside a function?`,["==",":=","=>"],1,"Declare a string, integer and boolean; print their values before assigning anything."],
["Control flow and loops","Use if, for, switch and defer to express program flow.",`<h2>Conditions and loops</h2><pre><code>for i := 1; i <= 3; i++ {\n    if i%2 == 0 {\n        fmt.Println(i, "even")\n    } else {\n        fmt.Println(i, "odd")\n    }\n}</code></pre><p>Go uses <code>for</code> for traditional loops, condition loops and range iteration. Braces are required around control-flow bodies. <code>defer</code> schedules a call to run when the surrounding function returns.</p>`,`Which keyword schedules a function call to run when the surrounding function returns?`,["finally","defer","ensure"],1,"Loop over a slice of three strings and print each one with its index."],
["Functions and errors","Return values explicitly and make failure paths clear.",`<h2>Multiple return values</h2><pre><code>func divide(a, b float64) (float64, error) {\n    if b == 0 {\n        return 0, fmt.Errorf("division by zero")\n    }\n    return a / b, nil\n}</code></pre><p>Go commonly returns an error as a value. Callers should inspect it instead of ignoring it. Add context with <code>fmt.Errorf</code> and <code>%w</code> when wrapping an error.</p>`,`What should a caller usually do with a non-nil error returned by a function?`,["Ignore it","Handle or propagate it","Convert it silently to zero"],1,"Write a function that parses a value and returns an error when the input is invalid."],
["Slices, maps and structs","Choose data structures and understand slice behavior.",`<h2>Common collections</h2><pre><code>names := []string{"Ada", "Linus"}\ncounts := map[string]int{"ok": 2}\n\ntype Server struct {\n    Name string\n    Port int\n}\n\ns := Server{Name: "api", Port: 8080}\nfmt.Println(names, counts, s)</code></pre><p>Slices are flexible views over arrays; maps store key/value pairs; structs group fields. A slice may share its underlying array with another slice, so mutations can be visible through both.</p>`,`Which Go collection stores key/value pairs?`,["Slice","Map","Array only"],1,"Create a map of service names to ports and print one service's port."],
["Methods and interfaces","Use behavior-based interfaces and composition.",`<h2>Interfaces describe behavior</h2><pre><code>type Stringer interface {\n    String() string\n}\n\ntype Service struct { Name string }\nfunc (s Service) String() string { return s.Name }</code></pre><p>A type satisfies an interface by implementing its methods; it does not need an explicit declaration. Keep interfaces small and define them near the code that consumes them when practical.</p>`,`Does a Go type need an explicit implements keyword to satisfy an interface?`,["Yes","No","Only for exported interfaces"],1,"Define a tiny interface with one method and make a struct satisfy it."],
["Concurrency and context","Use goroutines, channels, cancellation and synchronization safely.",`<h2>Start concurrent work</h2><pre><code>done := make(chan string)\ngo func() { done <- "finished" }()\nmessage := <-done\nfmt.Println(message)</code></pre><p>A goroutine runs concurrently. Channels communicate values between goroutines. Production code should also consider cancellation, blocked sends, shared-memory races, bounded worker pools and shutdown behavior.</p><div class="callout warn">Concurrency is not automatically faster. Bound parallel work and propagate <code>context.Context</code> through operations that may need cancellation.</div>`,`What can happen if a goroutine blocks forever on a channel send that no one receives?`,["It may leak and never finish","Go automatically retries forever then exits cleanly","The channel always drops the value"],0,"Sketch a worker pool with a fixed number of workers and a cancellation path."],
["Testing and tooling","Format, test, benchmark and inspect Go programs.",`<h2>Essential commands</h2><pre><code>gofmt -w .\ngo test ./...\ngo test -race ./...\ngo test -cover ./...\ngo vet ./...</code></pre><p>Formatting is part of the normal Go workflow. Table-driven tests help cover cases consistently. The race detector finds certain data races during execution; it is not a proof that a program is race-free.</p>`,`Which command runs tests in all packages under the current module?`,["go run ./...","go test ./...","go fmt test"],1,"Write table-driven tests for valid input, empty input and invalid input."]]},
{id:"python",name:"Python",symbol:"Py",cls:"py",tag:"Programming language",level:"Beginner to advanced",desc:"Automate tasks and build applications with clear, expressive Python.",official:"https://docs.python.org/3/",quick:"https://docs.python.org/3/tutorial/",topics:[
["Your first Python program","Run Python, use print and understand script entry points.",`<h2>Start with a script</h2><pre><code>def greet(name: str) -> str:\n    return f"Hello, {name}!"\n\nif __name__ == "__main__":\n    print(greet("world"))</code></pre><p>Save as <code>hello.py</code> and run <code>python3 hello.py</code>. The entry-point guard allows a file to be imported without running its main script behavior.</p>`,`What does the __name__ == "__main__" guard help control?`,["Whether the file's main block runs when executed directly","The Python version","Whether variables are immutable"],0,"Change the greeting to accept a name from a command-line argument."],
["Variables and data types","Understand names, strings, numbers, booleans and None.",`<h2>Names refer to objects</h2><pre><code>service = "api"\nretries = 3\nhealthy = True\nlast_error = None\n\nprint(f"{service}: retries={retries}, healthy={healthy}")</code></pre><p>Python is dynamically typed: names can be rebound to objects of different types. Type hints document intent and support tools, but Python does not enforce them automatically at runtime.</p>`,`Are Python type hints automatically enforced by the standard runtime?`,["Yes, always","No, not by default","Only for strings"],1,"Create variables for an environment name, port number and enabled flag, then print a readable summary."],
["Collections and comprehensions","Use lists, tuples, dictionaries, sets and comprehensions.",`<h2>Choose a collection</h2><pre><code>services = ["api", "worker", "web"]\nports = {"api": 8080, "web": 3000}\nactive = {name: True for name in services}\n\nprint(ports.get("api"))\nprint([name.upper() for name in services])</code></pre><p>Lists are ordered and mutable; tuples are immutable sequences; dictionaries map keys to values; sets contain unique elements. Choose based on the operations and invariants you need.</p>`,`Which collection is designed for key/value lookup?`,["Dictionary","Tuple","String"],0,"Build a list of names and use a comprehension to keep only names longer than four characters."],
["Conditions, loops and functions","Write reusable logic with clear arguments and return values.",`<h2>Functions</h2><pre><code>def retry_delay(attempt: int, base: float = 0.5) -> float:\n    if attempt < 1:\n        raise ValueError("attempt must be positive")\n    return base * (2 ** (attempt - 1))\n\nfor attempt in range(1, 4):\n    print(retry_delay(attempt))</code></pre><p>Default arguments are evaluated when the function is defined, so avoid mutable defaults such as <code>[]</code> unless that shared behavior is intentional. Prefer small functions with clear contracts.</p>`,`Why can a mutable list as a default argument be surprising?`,["It is shared between calls","Lists cannot be passed to functions","It makes the function asynchronous"],0,"Write a function that validates a port is between 1 and 65535."],
["Files, JSON and exceptions","Read and write files safely and handle failures explicitly.",`<h2>Use context managers</h2><pre><code>import json\nfrom pathlib import Path\n\nconfig_path = Path("config.json")\ntry:\n    config = json.loads(config_path.read_text())\nexcept FileNotFoundError:\n    config = {"environment": "dev"}\nexcept json.JSONDecodeError as exc:\n    raise ValueError("Invalid JSON config") from exc</code></pre><p><code>Path</code> makes path operations clearer. Context managers clean up resources reliably. Catch specific exceptions when you can recover; do not hide failures with broad empty handlers.</p>`,`What is the benefit of catching a specific exception instead of every exception?`,["It makes all errors disappear","It avoids masking unrelated failures","It disables tracebacks"],1,"Read a JSON configuration file and report a useful message if its content is invalid."],
["Modules, packages and environments","Organize code and isolate project dependencies.",`<h2>Create an isolated environment</h2><pre><code>python3 -m venv .venv\nsource .venv/bin/activate\npython -m pip install requests\npython -m pip freeze > requirements.txt</code></pre><p>A virtual environment separates project dependencies from the system Python. Pin and review dependencies appropriately for reproducible deployments; installation commands vary by project policy.</p>`,`Why use a virtual environment for a project?`,["To isolate project dependencies","To make Python code compile to Go","To remove the standard library"],0,"Create a virtual environment and document the commands needed to recreate it."],
["Testing and code quality","Test expected behavior and automate formatting and linting.",`<h2>A small unit test</h2><pre><code>def add(a, b):\n    return a + b\n\ndef test_add():\n    assert add(2, 3) == 5\n    assert add(-1, 1) == 0</code></pre><p>This is a pytest-style test. The standard library also includes <code>unittest</code>. Tests should cover normal cases, boundaries and expected failures. Linters and formatters catch different classes of issues.</p>`,`What should a useful test suite include besides normal successful inputs?`,["Boundary and failure cases","Only one happy-path test","No assertions"],0,"Test a function with empty, valid and invalid input cases."]]},
{id:"markdown",name:"Markdown",symbol:"M↓",cls:"md",tag:"Markup language",level:"Beginner to reference",desc:"Create readable documentation, READMEs, notes and technical guides.",official:"https://spec.commonmark.org/",quick:"https://github.github.com/gfm/",topics:[
["How Markdown works","Understand plain text, renderers, .md files and dialects.",`<h2>Markdown in one minute</h2><p>Markdown is a lightweight markup language that adds structure to plain text using readable punctuation. A Markdown processor renders that source into HTML or another output format.</p><pre><code># Project title\n\nA short **description**.\n\n- Easy to read\n- Easy to version</code></pre><p>CommonMark defines a standardized core; GitHub Flavored Markdown adds common features such as tables, task lists and strikethrough.</p>`,`Which statement is most accurate?`,["Every Markdown renderer supports exactly the same extensions","Markdown is plain-text source interpreted by a renderer","Markdown files must contain HTML"],1,"Write a short introduction and a three-item list for a project README."],
["Headings, paragraphs and emphasis","Structure content with headings, blank lines, bold and italic.",`<h2>Basic structure</h2><pre><code># Main title\n## Section\n\nA paragraph with **bold** and *italic* text.\n\nLine one  \nLine two</code></pre><p>Use one to six hash characters for headings and separate paragraphs with a blank line. Two trailing spaces create a hard line break in CommonMark; line-break behavior is often a source of renderer differences.</p>`,`What is the recommended way to separate paragraphs?`,["A blank line","A single comma","A slash at every line end"],0,"Create a title, two section headings and a paragraph with bold and italic text."],
["Links and images","Add links, anchors, images and meaningful alt text.",`<h2>Links and images</h2><pre><code>[CommonMark](https://spec.commonmark.org/)\n\n![A useful description](images/diagram.png)\n\n[Reference link][docs]\n\n[docs]: https://docs.github.com/en/get-started/writing-on-github</code></pre><p>Use descriptive link text and meaningful image alt text. Relative image paths are usually resolved from the Markdown file, but publishing systems can differ.</p>`,`What should useful image alt text primarily describe?`,["The image filename","The meaningful information or purpose of the image","The file size"],1,"Add one official link and one image with useful alternative text."],
["Code blocks and escaping","Format commands and code without accidental rendering.",`<h2>Fenced code</h2><pre><code>\`\`\`bash\nprintf '%s\\n' "Hello"\n\`\`\`</code></pre><p>Use backticks for inline code and fenced blocks for multi-line examples. Add a language hint for syntax highlighting. Escape Markdown punctuation when you need it displayed literally.</p><pre><code>\\*This should not be italic\\*</code></pre>`,`Why add bash after an opening code fence?`,["It can tell a renderer which syntax highlighting to use","It runs the command automatically","It changes the file into a shell script"],0,"Write a fenced code block containing a command and a short explanation."],
["Tables, task lists and flavors","Know common extensions and portability tradeoffs.",`<h2>GFM examples</h2><pre><code>| Task | Status |\n| --- | --- |\n| Draft | Done |\n| Review | In progress |\n\n- [x] Write\n- [ ] Review\n\n~~Deprecated text~~</code></pre><p>Tables, task lists and strikethrough are common in GitHub Flavored Markdown but are not all part of CommonMark core. Check your target renderer before relying on extensions.</p>`,`Are pipe tables required by the CommonMark core specification?`,["Yes","No","Only in code blocks"],1,"Create a table with a command, its purpose and an example."],
["README, troubleshooting and cheat sheet","Use Markdown in real project docs and diagnose rendering issues.",`<h2>README structure</h2><pre><code># Project\n\nWhat it does and why it exists.\n\n## Requirements\n- Runtime\n- Dependencies\n\n## Installation\n\`\`\`bash\n./install.sh\n\`\`\`\n\n## Usage\nExplain a working example.\n\n## Troubleshooting\nDocument common errors.</code></pre><p>Prefer logical heading hierarchy, useful links, copy-ready commands and examples verified against the target renderer. An unclosed code fence can cause the rest of a page to render as code.</p>`,`What is a good first check when the rest of a page unexpectedly renders as code?`,["Look for a missing closing code fence","Rename every heading","Remove all blank lines"],0,"Write a README with installation, usage, configuration and troubleshooting sections."]]},
{id:"shell",name:"Shell scripting",symbol:"$_",cls:"sh",tag:"Automation",level:"Beginner to advanced",desc:"Automate Linux and Unix tasks with robust, repeatable shell scripts.",official:"https://www.gnu.org/software/bash/manual/",quick:"https://mywiki.wooledge.org/BashGuide",topics:[
["Shell fundamentals and first script","Understand commands, shebangs, exit statuses and execution.",`<h2>Your first Bash script</h2><pre><code>#!/usr/bin/env bash\nprintf 'Hello, world!\\n'</code></pre><p>Save as <code>hello.sh</code> and run <code>bash hello.sh</code>. A shebang selects an interpreter when a script is executed directly. A command's exit status conventionally uses zero for success and non-zero for failure.</p>`,`What does an exit status of zero conventionally indicate?`,["Success","A warning in every shell","The script was never executed"],0,"Write a script that prints the current user and current directory."],
["Variables and quoting","Use safe expansion and preserve spaces in filenames.",`<h2>Quote variable expansions</h2><pre><code>#!/usr/bin/env bash\nset -u\nname="${'${'}1:-world}"\nprintf 'Hello, %s!\\n' "$name"</code></pre><p>Double quotes preserve the result as one argument and prevent unwanted word splitting and pathname expansion. Single quotes preserve literal characters. Avoid using <code>eval</code> on untrusted input.</p>`,`Why quote a variable such as "$filename" when passing it to a command?`,["To preserve spaces and avoid unintended splitting","To make the file executable","To suppress every command error"],0,"Test your script with an argument containing spaces."],
["Conditions, loops and functions","Build reusable scripts with tests, loops and functions.",`<h2>Check command results</h2><pre><code>if [[ -f "$config" ]]; then\n    printf 'Config exists\\n'\nelse\n    printf 'Config is missing\\n' >&2\n    exit 1\nfi</code></pre><p>Bash's <code>[[ ... ]]</code> supports conditional expressions. Use functions to isolate reusable logic, and explicitly handle missing files, invalid arguments and failed commands.</p>`,`Which stream is conventionally used for error messages?`,["stdout only","stderr","stdin"],1,"Write a function that checks whether a given path is a directory."],
["Pipes, files and text processing","Combine commands with redirection and Unix text tools.",`<h2>Build a pipeline</h2><pre><code>grep -h 'ERROR' ./*.log 2>/dev/null | sort | uniq -c\n\n# Inspect disk usage safely\ndu -sh ./logs</code></pre><p>Pipes connect one command's stdout to another command's stdin. Redirection can save output or separate errors. For robust scripts, consider pipeline exit statuses and filenames containing unusual characters.</p>`,`What does a pipe connect by default?`,["One command's stdout to another command's stdin","Two processes' permissions","Two filesystems"],0,"Count error lines in sample logs and save a report to a separate output file."],
["Processes, traps and robust errors","Handle signals, cleanup, failures and safe dry runs.",`<h2>Cleanup with a trap</h2><pre><code>#!/usr/bin/env bash\nset -u\ntmp_file=$(mktemp)\ncleanup() { rm -f -- "$tmp_file"; }\ntrap cleanup EXIT\nprintf 'temporary data\\n' > "$tmp_file"\ncat "$tmp_file"</code></pre><p>Traps allow cleanup when a shell exits or receives supported signals. <code>set -e</code> has exceptions and context-dependent behavior, so do not treat it as a complete error-handling strategy. Check critical commands explicitly.</p><div class="callout warn">Test cleanup scripts in a temporary directory. Avoid destructive commands against real paths until inputs, safeguards and dry-run output are verified.</div>`,`What is a common use for a trap on EXIT?`,["Cleanup temporary resources","Install system packages automatically","Disable file permissions"],0,"Add a dry-run mode to a script that proposes file deletions without deleting anything."],
["DevOps recipes, testing and security","Use ShellCheck, syntax checks, safe inputs and repeatable automation.",`<h2>Useful checks</h2><pre><code>bash -n script.sh\nshellcheck script.sh\nbash -x script.sh</code></pre><p><code>bash -n</code> checks syntax without executing the script. ShellCheck provides static analysis. Tracing helps debug but may expose secrets in logs, so review output carefully. Quote variables, validate arguments, use least privilege and avoid interpolating untrusted input into shell commands.</p>`,`Which command checks Bash syntax without running the script?`,["bash -n script.sh","rm -rf script.sh","bash --install"],0,"Create a read-only disk-usage report script with configurable input paths and a clear error message for missing paths."]]}
];
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),searchBox=document.getElementById('search');let current={view:'home'},completed=JSON.parse(localStorage.getItem('mb-completed')||'{}'),quizAnswers={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function getTrack(id){return tracks.find(t=>t.id===id)}
function isDone(t,i){return !!completed[t.id+'-'+i]}
function progress(t){return t.topics.filter((_,i)=>isDone(t,i)).length}
function saveDone(t,i,v){completed[t.id+'-'+i]=v;localStorage.setItem('mb-completed',JSON.stringify(completed))}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1800)}
function buildSidebar(){sidebar.innerHTML=`<div class="side-label">Workspace</div><button class="navbtn" data-home><span class="navicon">⌂</span>Learning dashboard</button><button class="navbtn" data-play><span class="navicon">▷</span>Markdown playground</button><div class="side-label">Learning paths</div>${tracks.map(t=>`<button class="navbtn" data-track="${t.id}"><span class="navicon">${t.symbol}</span>${t.name}<span style="margin-left:auto;color:#98a2b5;font-size:10px">${progress(t)}/${t.topics.length}</span></button>`).join('')}<div class="side-bottom"><b>Learning tip</b><p>Read a concept, test your understanding, then mark the lesson complete.</p><button class="btn small" onclick="showHome()">Explore library</button></div>`;sidebar.querySelector('[data-home]').onclick=showHome;sidebar.querySelector('[data-play]').onclick=showPlayground;sidebar.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>showTrack(b.dataset.track))}
function setActive(selector){sidebar.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));let b=sidebar.querySelector(selector);if(b)b.classList.add('active')}
function footer(){return `<div class="footer"><span>© Markbase Studio · Independent learning library</span><span>Content is a learning aid; verify version-specific details in official references.</span></div>`}
function showHome(){current={view:'home'};setActive('[data-home]');document.title='Markbase Studio — Learn by building';main.innerHTML=`<div class="breadcrumb">Workspace / Dashboard</div><section class="hero"><div class="hero-inner"><div class="kicker">Your personal learning workspace</div><h1>Less searching.<br><span>More building.</span></h1><p>Explore clear lessons, practice with interactive challenges, and build real skills in Go, Python, Markdown and Shell scripting — all in one focused learning library.</p><div class="actions"><button class="btn" onclick="showTrack('go')">Start learning <span aria-hidden="true">→</span></button><button class="btn light" onclick="showPlayground()">Try Markdown playground ↗</button></div></div></section><div class="stats"><div class="stat"><strong>4</strong><small>Curated learning paths</small></div><div class="stat"><strong>${tracks.reduce((a,t)=>a+t.topics.length,0)}</strong><small>Interactive topic starters</small></div><div class="stat"><strong>${tracks.reduce((a,t)=>a+progress(t),0)}</strong><small>Lessons completed</small></div></div><div class="section-head"><div><h2>Choose your learning path</h2><p>Structured from fundamentals to practical skills.</p></div></div><div class="cards">${tracks.map(t=>`<article class="track" onclick="showTrack('${t.id}')"><div class="track-top"><div class="track-icon ${t.cls}">${t.symbol}</div><span class="chip">${t.level}</span></div><h3>${t.name}</h3><p>${t.desc}</p><div class="meta"><span class="chip">${t.topics.length} modules</span><span class="chip">${progress(t)} completed</span></div><div class="track-foot"><span>Explore path</span><span>↗</span></div></article>`).join('')}</div><div class="section-head"><div><h2>Make progress visible</h2><p>Your lesson progress is saved in this browser on this device.</p></div></div><div class="panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><b>Learning progress</b><p style="margin:4px 0 0;font-size:13px">Complete lessons to track your momentum.</p></div><b>${Math.round(tracks.reduce((a,t)=>a+progress(t),0)/tracks.reduce((a,t)=>a+t.topics.length,0)*100)}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${tracks.reduce((a,t)=>a+progress(t),0)/tracks.reduce((a,t)=>a+t.topics.length,0)*100}%"></div></div></div>${footer()}`}
function showTrack(id){let t=getTrack(id);if(!t)return showHome();current={view:'track',id};setActive(`[data-track="${id}"]`);document.title=t.name+' — Markbase Studio';let done=progress(t);main.innerHTML=`<div class="breadcrumb"><a href="#" onclick="showHome();return false">Library</a> / ${t.name}</div><section class="track-banner"><div class="track-icon ${t.cls}">${t.symbol}</div><div style="flex:1"><span class="chip">${t.tag}</span><h1>${t.name}</h1><p>${t.desc}</p></div><a href="${t.official}" target="_blank" rel="noreferrer">Official docs ↗</a></section><div class="progress-wrap"><div class="progress-top"><span>Your learning path</span><span>${done} of ${t.topics.length} completed</span></div><div class="progress-track"><div class="progress-fill" style="width:${done/t.topics.length*100}%"></div></div></div><div class="section-head"><div><h2>Course modules</h2><p>Work through in order or jump directly to a topic.</p></div><span class="chip">${t.level}</span></div><div class="topic-list">${t.topics.map((x,i)=>`<button class="topic ${isDone(t,i)?'done':''}" onclick="showLesson('${t.id}',${i})"><span class="topic-num">${isDone(t,i)?'✓':String(i+1).padStart(2,'0')}</span><span style="flex:1"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></span><span class="topic-arrow">→</span></button>`).join('')}</div><div class="section-head"><div><h2>Official learning resources</h2><p>Use the authoritative documentation alongside these lessons.</p></div></div><div class="panel"><p><a href="${t.official}" target="_blank" rel="noreferrer">${t.name} official documentation ↗</a> &nbsp; · &nbsp; <a href="${t.quick}" target="_blank" rel="noreferrer">Tutorial / reference ↗</a></p></div>${footer()};`}
function showLesson(id,i){let t=getTrack(id),x=t.topics[i];if(!t||!x)return;current={view:'lesson',id,index:i};setActive(`[data-track="${id}"]`);document.title=x[0]+' — '+t.name+' | Markbase';let [title,desc,body,question,options,correct,exercise]=x;let quizKey=id+'-'+i;let answer=quizAnswers[quizKey];main.innerHTML=`<div class="breadcrumb"><a href="#" onclick="showHome();return false">Library</a> / <a href="#" onclick="showTrack('${id}');return false">${t.name}</a> / Module ${i+1}</div><div class="lesson-layout"><article class="lesson"><div class="kicker" style="color:var(--accent)">${t.name} · MODULE ${String(i+1).padStart(2,'0')}</div><h1 class="page-title">${esc(title)}</h1><p class="subtitle">${esc(desc)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:17px 0"><span class="chip">Concept</span><span class="chip">Example</span><span class="chip">Knowledge check</span></div>${body}<h2>Knowledge check</h2><div class="quiz"><h3>${esc(question)}</h3><p style="font-size:12px;color:var(--muted)">Choose one answer to check your understanding.</p>${options.map((o,j)=>`<label class="option"><input type="radio" name="quiz" value="${j}" ${answer===j?'checked':''}> <span>${esc(o)}</span></label>`).join('')}<button class="btn small" onclick="checkQuiz('${id}',${i},${correct})">Check answer</button><div id="feedback" class="feedback">${answer===correct?'✓ Correct!':answer!==undefined?'Try again — review the concept above.':''}</div></div><h2>Practice challenge</h2><div class="callout"><b>Now you try</b><br>${esc(exercise)}</div><h2>Reference</h2><p>For complete syntax and version-specific details, consult the official ${t.name} documentation.</p><p><a href="${t.official}" target="_blank" rel="noreferrer">${t.name} official documentation ↗</a></p><div class="lesson-nav"><button class="btn light" onclick="${i>0?`showLesson('${id}',${i-1})`:`showTrack('${id}')`}">← ${i>0?'Previous lesson':'Course overview'}</button><button class="btn" onclick="completeLesson('${id}',${i})">${isDone(t,i)?'Completed ✓':'Mark complete ✓'}</button>${i<t.topics.length-1?`<button class="btn light" onclick="showLesson('${id}',${i+1})">Next →</button>`:''}</div></article><aside class="lesson-side"><h4>In this lesson</h4><a href="#top">Overview</a><a href="#top">Core concept</a><a href="#top">Example</a><a href="#top">Knowledge check</a><a href="#top">Practice challenge</a><div class="side-card"><b style="font-size:12px">Module progress</b><p style="font-size:11px;color:var(--muted)">${progress(t)} of ${t.topics.length} course modules completed.</p><div class="progress-track"><div class="progress-fill" style="width:${progress(t)/t.topics.length*100}%"></div></div><p style="font-size:11px"><a href="${t.quick}" target="_blank" rel="noreferrer">Official tutorial ↗</a></p></div></aside></div>${footer()}`;window.scrollTo({top:0,behavior:'smooth'})}
function checkQuiz(id,i,correct){let picked=document.querySelector('input[name="quiz"]:checked');if(!picked){toast('Choose an answer first');return}let value=+picked.value;quizAnswers[id+'-'+i]=value;let fb=document.getElementById('feedback');fb.textContent=value===correct?'✓ Correct! Great work.':'Not quite — review the example and try again.';fb.style.color=value===correct?'#087c59':'#b45309';}
function completeLesson(id,i){let t=getTrack(id);saveDone(t,i,true);buildSidebar();toast('Lesson progress saved');if(i<t.topics.length-1)showLesson(id,i+1);else showTrack(id)}
function showPlayground(){current={view:'play'};setActive('[data-play]');document.title='Markdown playground — Markbase';main.innerHTML=`<div class="breadcrumb"><a href="#" onclick="showHome();return false">Library</a> / Playground</div><div class="kicker" style="color:var(--accent)">Interactive workspace</div><h1 class="page-title">Markdown playground</h1><p class="subtitle">Write Markdown on the left and preview a safe subset of the rendered result on the right. Everything runs locally in your browser.</p><div class="notice">This lightweight playground is a demonstration, not a complete CommonMark/GFM parser. Raw HTML is escaped for safety; tables and common syntax are supported.</div><div class="toolbar" style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><span class="chip" id="wordcount">0 words</span><div style="display:flex;gap:7px"><button class="btn light small" id="resetMd">Reset</button><button class="btn light small" id="copyMd">Copy source</button></div></div><div class="playground"><div><div class="label">Markdown source</div><textarea id="mdsource" spellcheck="false"># Hello, Markbase!

Write **Markdown** and see the preview update.

## My checklist
- [x] Learn the basics
- [ ] Practice links
- [ ] Publish a README

> Clear documentation helps teams work better.

\`\`\`bash
echo "Hello, world!"
\`\`\`

| Syntax | Purpose |
| --- | --- |
| \`#\` | Heading |
| \`**text**\` | Bold |</textarea></div><div><div class="label">Live preview</div><div id="mdpreview" class="preview"></div></div></div><h2 style="margin-top:32px">Try these challenges</h2><div class="topic-list"><button class="topic" onclick="insertChallenge('table')"><span class="topic-num">01</span><span><b>Create a comparison table</b><small>Compare three tools and their use cases.</small></span><span>→</span></button><button class="topic" onclick="insertChallenge('readme')"><span class="topic-num">02</span><span><b>Draft a README</b><small>Add installation, usage and troubleshooting.</small></span><span>→</span></button></div>${footer()}`;let ta=document.getElementById('mdsource');ta.addEventListener('input',updateMarkdown);document.getElementById('resetMd').onclick=()=>{ta.value='# Start here\\n\\nWrite **Markdown** here.';updateMarkdown()};document.getElementById('copyMd').onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);toast('Markdown copied')}catch{ta.select();document.execCommand('copy');toast('Markdown selected/copied')}};updateMarkdown();window.scrollTo({top:0,behavior:'smooth'})}
function insertChallenge(which){let ta=document.getElementById('mdsource');if(!ta)return;ta.value=which==='table'?'# Tool comparison\\n\\n| Tool | Use case | Notes |\\n| --- | --- | --- |\\n| Go | Services | Fast binaries |\\n| Python | Automation | Readable scripts |\\n| Shell | System tasks | Glue commands |':'# Project name\\n\\nA short description of this project.\\n\\n## Installation\\n\\n```bash\\ngit clone https://example.com/project.git\\n```\\n\\n## Usage\\nExplain a working example.\\n\\n## Troubleshooting\\nDocument common issues.';updateMarkdown()}
function mdRender(src){let escHtml=s=>esc(s);let blocks=[];src=src.replace(/\r/g,'').replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push('<pre><code>'+escHtml(c.replace(/\n$/,''))+'</code></pre>');return '\n@@B'+(blocks.length-1)+'@@\n'});let lines=src.split('\n'),out=[],ul=false,ol=false;function close(){if(ul){out.push('</ul>');ul=false}if(ol){out.push('</ol>');ol=false}}function inl(s){return escHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/!\[([^\]]*)\]\((https?:\/\/[^ )]+|[^ )]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">').replace(/\[([^\]]+)\]\((https?:\/\/[^ )]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')}for(let i=0;i<lines.length;i++){let l=lines[i],x=l.trim();if(!x){close();continue}let bm=x.match(/^@@B(\d+)@@$/);if(bm){close();out.push(blocks[+bm[1]]);continue}let h=x.match(/^(#{1,6})\s+(.+)$/);if(h){close();out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);continue}if(/^(-{3,}|\*{3,})$/.test(x)){close();out.push('<hr>');continue}if(x.startsWith('>')){close();out.push('<blockquote>'+inl(x.replace(/^>\s?/,''))+'</blockquote>');continue}let u=x.match(/^[-*+]\s+(.+)$/),o=x.match(/^\d+\.\s+(.+)$/);if(u){if(ol){out.push('</ol>');ol=false}if(!ul){out.push('<ul>');ul=true}out.push('<li>'+inl(u[1].replace(/^\[([ xX])\]\s*/,m=>m[1].toLowerCase()==='x'?'☑ ':'☐ '))+'</li>');continue}if(o){if(ul){out.push('</ul>');ul=false}if(!ol){out.push('<ol>');ol=true}out.push('<li>'+inl(o[1])+'</li>');continue}close();if(x.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1])){let cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());out.push('<table><thead><tr>'+cells(x).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>');i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){out.push('<tr>'+cells(lines[i]).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>');i++}out.push('</tbody></table>');i--;continue}out.push('<p>'+inl(x)+'</p>')}close();return out.join('')}
function updateMarkdown(){let ta=document.getElementById('mdsource'),pr=document.getElementById('mdpreview'),wc=document.getElementById('wordcount');if(!ta)return;pr.innerHTML=mdRender(ta.value);wc.textContent=ta.value.trim().split(/\s+/).filter(Boolean).length+' words · '+ta.value.length+' characters'}
function runSearch(q){let results=[];tracks.forEach(t=>{if((t.name+' '+t.desc+' '+t.tag).toLowerCase().includes(q.toLowerCase()))results.push({track:t,title:t.name+' learning path',desc:t.desc,idx:null});t.topics.forEach((x,i)=>{if((t.name+' '+x[0]+' '+x[1]+' '+x[3]).toLowerCase().includes(q.toLowerCase()))results.push({track:t,title:x[0],desc:x[1],idx:i})})});main.innerHTML=`<div class="breadcrumb">Workspace / Search</div><div class="kicker" style="color:var(--accent)">Knowledge search</div><h1 class="page-title">Search results</h1><p class="subtitle">${results.length} results for “${esc(q)}”</p>${results.length?results.map(r=>`<button class="topic" style="width:100%;margin:7px 0;text-align:left" onclick="${r.idx===null?`showTrack('${r.track.id}')`:`showLesson('${r.track.id}',${r.idx})`}"><span class="topic-num">${r.track.symbol}</span><span><b>${esc(r.title)}</b><small>${esc(r.track.name)} · ${esc(r.desc)}</small></span><span class="topic-arrow">→</span></button>`).join(''):'<div class="empty">No matches found. Try “functions”, “testing”, “links”, “quoting” or “concurrency”.</div>'}`;setActive(null)}
buildSidebar();showHome();document.getElementById('homeBtn').onclick=showHome;document.getElementById('menuBtn').onclick=()=>sidebar.classList.toggle('open');searchBox.addEventListener('input',e=>{let q=e.target.value.trim();if(q.length>1)runSearch(q);else if(!q)showHome()});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();searchBox.focus()}if(e.key==='Escape'){searchBox.value='';showHome()}})
</script></body></html>
